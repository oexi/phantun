[package]
name = "phantun"
version = "0.8.1"
edition = "2024"
authors = ["Datong Sun <dndx@idndx.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dndx/phantun"
readme = "README.md"
description = """
Transforms UDP stream into (fake) TCP streams that can go through
Layer 3 & Layer 4 (NAPT) firewalls/NATs.
"""
[dependencies]
clap = { version = "4", features = ["cargo"] }
socket2 = { version = "0", features = ["all"] }
fake-tcp = { path = "../fake-tcp", version = "0" }
tokio-util = "0"
pretty_env_logger = "0"
tokio-tun = "0"
num_cpus = "1"
neli = "0"
nix = { version = "0", features = ["net", "uio", "socket"] }
tokio = { workspace = true }
log = { workspace = true }
reed-solomon-erasure = "6"
rand = "0"

# The SIMD code is only built for x86_64 and aarch64, and on x86_64 it requires AVX2, which older
# CPUs lack
[target.'cfg(target_arch = "aarch64")'.dependencies]
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }

# The eBPF data path, aya does not support 32-bit x86
[target.'cfg(not(target_arch = "x86"))'.dependencies]
aya = { version = "0.14", default-features = false }
